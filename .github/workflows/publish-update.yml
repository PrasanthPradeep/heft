name: Publish over-the-air update

# `main` is where work lands. `stable` is what phones run, so merging a pull
# request from main into stable *is* the release action.
#
# Pull requests get the same checks without shipping anything, which means you
# can see a green tick before merging. The channel below is `preview` because
# that is what the installed APK subscribes to: a channel is baked into a build,
# so renaming it would mean rebuilding and reinstalling the APK.

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

concurrency:
  # Serialise publishes per branch so two quick merges cannot race.
  group: publish-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # eas update records the commit it publishes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # A missing secret must stop the release loudly rather than quietly ship
      # nothing. Set it once with: gh secret set EXPO_TOKEN
      - name: Check that the publish token is configured
        if: github.event_name != 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Create an access token at https://expo.dev/settings/access-tokens, then run: gh secret set EXPO_TOKEN"
            exit 1
          fi

      - name: Publish update
        if: github.event_name != 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx eas-cli@latest update \
            --channel preview \
            --environment preview \
            --non-interactive \
            --message "${MESSAGE:-Publish from stable}"
